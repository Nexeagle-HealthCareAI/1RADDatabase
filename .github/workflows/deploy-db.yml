# ═══════════════════════════════════════════════════════════════════════════════
# 1RAD DATABASE — Validate + Schema Migrations
# ═══════════════════════════════════════════════════════════════════════════════
#
# JOBS
#   validate     every PR and push: builds a FRESH database from the scripts in a
#                throwaway SQL Server 2022 container, re-runs new scripts (>= 96) to
#                prove they are guarded, and fails before anything reaches a server.
#   deploy-dev   develop  → Dev VM   (after validate)
#   deploy-prod  main     → Prod VM  (after validate + "production" environment approval)
#
# Every environment applies scripts with the same file: deploy/apply-migrations.sh
# (schema/NN_*.sql + data/*.sql, __MigrationHistory ledger, one transaction per
# script). Unnumbered scripts live in archive/ and are never run. The Azure DevOps
# pipeline was retired in Oct 2026 (it re-ran everything, including a script that
# dropped the HR tables).
#
# SECRETS (repo → Settings → Secrets → Actions)
#   DEV_SSH_HOST, DEV_SSH_USER, DEV_SSH_PASSWORD, DEV_SA_PASSWORD
#   PROD_DB_SSH_HOST, PROD_DB_SSH_USER, PROD_SSH_KEY_B64, PROD_SA_PASSWORD
# ═══════════════════════════════════════════════════════════════════════════════

name: 1RAD DB — Schema Migrations

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'data/**'
      - 'deploy/**'
      - '.github/workflows/deploy-db.yml'
  push:
    branches: [develop, main]
    paths:
      - 'schema/**'
      - 'data/*.sql'
      - 'deploy/**'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what WOULD run on the server without applying'
        required: false
        default: false
        type: boolean

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: "Validate scripts on a fresh SQL Server"
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          # Throwaway container that lives only for this job.
          MSSQL_SA_PASSWORD: "Ci-${{ github.run_id }}-Xy9!"
        ports: ["1433:1433"]
    env:
      SA_PASSWORD: "Ci-${{ github.run_id }}-Xy9!"
      SQL_CONTAINER: ${{ job.services.mssql.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse unnumbered scripts in schema/
        run: |
          BAD=$(find schema -maxdepth 1 -type f -name '*.sql' | xargs -r -n1 basename | grep -vE '^[0-9]{2,3}_.*\.sql$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Only NN_*.sql belongs in schema/. Move these to archive/ or number them:"; echo "$BAD"; exit 1
          fi

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::SQL Server did not start"; exit 1

      - name: Build the database from scratch
        run: DEPLOY_DIR="$GITHUB_WORKSPACE" bash deploy/apply-migrations.sh

      - name: Re-run new scripts (>= 96) to prove they are guarded
        run: |
          for f in $(ls schema | grep -E '^[0-9]{2,3}_.*\.sql$' | sort -V | sed 's|^|schema/|'); do
            n=$(basename "$f" | sed -nE 's/^([0-9]{2,3})_.*/\1/p')
            [ "$((10#$n))" -ge 96 ] || continue
            echo "re-running $f"
            docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d 1RadDatabase < "$f"
          done

      - name: Export schema snapshot
        run: |
          docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -d 1RadDatabase -h -1 -W -s "," \
            -Q "SET NOCOUNT ON; SELECT TABLE_NAME, COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='dbo' ORDER BY TABLE_NAME, ORDINAL_POSITION;" \
            > schema-columns.csv
          wc -l schema-columns.csv

      - uses: actions/upload-artifact@v4
        with:
          name: schema-columns
          path: schema-columns.csv

  # ─────────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy Schema → Dev"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Copy scripts to Dev VM
        env:
          SSHPASS: ${{ secrets.DEV_SSH_PASSWORD }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          TARGET="${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}"
          sshpass -e ssh $SSH_OPTS "$TARGET" 'rm -rf /opt/myapp/dbdeploy && mkdir -p /opt/myapp/dbdeploy/schema /opt/myapp/dbdeploy/data /opt/myapp/dbdeploy/deploy'
          sshpass -e scp $SSH_OPTS schema/[0-9]*_*.sql "$TARGET":/opt/myapp/dbdeploy/schema/
          sshpass -e scp $SSH_OPTS data/*.sql "$TARGET":/opt/myapp/dbdeploy/data/
          sshpass -e scp $SSH_OPTS deploy/apply-migrations.sh "$TARGET":/opt/myapp/dbdeploy/deploy/

      - name: Apply migrations on Dev VM
        env:
          SSHPASS: ${{ secrets.DEV_SSH_PASSWORD }}
          SA_PASSWORD: ${{ secrets.DEV_SA_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}" "bash -s" <<REMOTE
          set -e
          export SA_PASSWORD='$SA_PASSWORD' DRY_RUN='$DRY_RUN' SQL_CONTAINER=sqlserver DEPLOY_DIR=/opt/myapp/dbdeploy
          bash /opt/myapp/dbdeploy/deploy/apply-migrations.sh
          REMOTE

      - name: Summary
        if: always()
        run: |
          echo "## 🗄️ DB Migration — Dev: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: "Deploy Schema → Prod"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.PROD_SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy scripts to Prod DB VM
        run: |
          SSH_OPTS="-i /tmp/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          TARGET="${{ secrets.PROD_DB_SSH_USER }}@${{ secrets.PROD_DB_SSH_HOST }}"
          ssh $SSH_OPTS "$TARGET" 'rm -rf /opt/nexeagle-prod/dbdeploy && mkdir -p /opt/nexeagle-prod/dbdeploy/schema /opt/nexeagle-prod/dbdeploy/data /opt/nexeagle-prod/dbdeploy/deploy'
          scp $SSH_OPTS schema/[0-9]*_*.sql "$TARGET":/opt/nexeagle-prod/dbdeploy/schema/
          scp $SSH_OPTS data/*.sql "$TARGET":/opt/nexeagle-prod/dbdeploy/data/
          scp $SSH_OPTS deploy/apply-migrations.sh "$TARGET":/opt/nexeagle-prod/dbdeploy/deploy/

      - name: Apply migrations on Prod DB VM
        env:
          SA_PASSWORD: ${{ secrets.PROD_SA_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.PROD_DB_SSH_USER }}@${{ secrets.PROD_DB_SSH_HOST }}" "bash -s" <<REMOTE
          set -e
          export SA_PASSWORD='$SA_PASSWORD' DRY_RUN='$DRY_RUN' SQL_CONTAINER=sqlserver DEPLOY_DIR=/opt/nexeagle-prod/dbdeploy
          bash /opt/nexeagle-prod/dbdeploy/deploy/apply-migrations.sh
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f /tmp/deploy_key

      - name: Summary
        if: always()
        run: |
          echo "## 🗄️ DB Migration — Prod: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit \`${{ github.sha }}\` · approved by ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
