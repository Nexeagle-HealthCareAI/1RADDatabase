# ─────────────────────────────────────────────────────────────────────────────
# 1RAD Database — Deploy SQL schema to Dev VM
#
# Triggers:
#   develop branch  →  runs all schema scripts on Dev SQL Server
#   main branch     →  runs on Prod SQL Server (requires approval)
#
# Required GitHub Secrets:
#   DEV_SSH_HOST    Dev VM public IP
#   DEV_SSH_USER    root
#   DEV_SSH_KEY     Private SSH key
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy 1RAD Database

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'schema/**'
      - 'data/**'
      - '.github/workflows/deploy-db.yml'

jobs:
  deploy-dev:
    name: Deploy schema to Dev SQL Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Copy schema files to Dev VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "schema/[0-9][0-9]_*.sql"
          target: "/opt/myapp/dbdeploy/"
          strip_components: 1

      - name: Run schema scripts on Dev SQL Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            # Create database if it doesn't exist
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "Strong_Pass_123!" -C \
              -Q "IF DB_ID('1RadDatabase') IS NULL CREATE DATABASE [1RadDatabase];"

            # Run all numbered schema scripts in order (skip loose unnumbered files)
            for f in $(ls /opt/myapp/dbdeploy/[0-9][0-9]_*.sql 2>/dev/null | sort); do
              echo "Applying: $(basename $f)"
              docker exec -i sqlserver /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "Strong_Pass_123!" -C \
                -d 1RadDatabase -b -I \
                < "$f" && echo "OK: $(basename $f)" || echo "WARN: $(basename $f) had errors (may already exist)"
            done

            echo "Schema deployment complete"

            # Show table count
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "Strong_Pass_123!" -C \
              -d 1RadDatabase \
              -Q "SELECT COUNT(*) AS TotalTables FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE';"

  deploy-prod:
    name: Deploy schema to Prod SQL Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy schema files to Prod VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "schema/[0-9][0-9]_*.sql"
          target: "/opt/myapp/dbdeploy/"
          strip_components: 1

      - name: Run schema scripts on Prod SQL Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "Strong_Pass_123!" -C \
              -Q "IF DB_ID('1RadDatabase') IS NULL CREATE DATABASE [1RadDatabase];"

            for f in $(ls /opt/myapp/dbdeploy/[0-9][0-9]_*.sql 2>/dev/null | sort); do
              echo "Applying: $(basename $f)"
              docker exec -i sqlserver /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "Strong_Pass_123!" -C \
                -d 1RadDatabase -b -I \
                < "$f" && echo "OK: $(basename $f)" || echo "WARN: $(basename $f) had errors"
            done

            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "Strong_Pass_123!" -C \
              -d 1RadDatabase \
              -Q "SELECT COUNT(*) AS TotalTables FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE';"
