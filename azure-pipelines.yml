trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: action
    displayName: Action (applies to Dev and Prod)
    type: string
    default: deploy
    values:
      - deploy
      - rollback
  # Azure Dev SQL is no longer deployed on every push (that kept the serverless
  # DB awake 24/7 and drove the bill). It now only runs when an operator opts in
  # by queueing with deployToDev: true — e.g. a pre-release parity check.
  - name: deployToDev
    displayName: Deploy to Azure Dev SQL? (manual; off by default)
    type: boolean
    default: false
  - name: deployToProd
    displayName: Promote to Production?
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

stages:
  # ────────────────────────────────────────────────────────────────────────
  # Stage 1 — ValidateDB  (AUTO on every push, $0)
  # Spins up a throwaway SQL Server 2022 container ON THE AGENT and applies all
  # schema + data scripts from an EMPTY database. Proves the scripts apply
  # cleanly without ever touching (or billing) Azure SQL. Gates everything else.
  # ────────────────────────────────────────────────────────────────────────
  - stage: ValidateDB
    displayName: Validate DB (container)
    jobs:
      - job: ValidateSchema
        timeoutInMinutes: 30
        variables:
          SA_PASSWORD: 'Strong_Pass_123!'
          DB_NAME: '1RadDatabase'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: Start SQL Server container
            inputs:
              targetType: inline
              script: |
                set -e
                docker run -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=$(SA_PASSWORD)" \
                  -e "MSSQL_PID=Developer" -p 1433:1433 \
                  --name radsql -d mcr.microsoft.com/mssql/server:2022-latest

          - task: Bash@3
            displayName: Install sqlcmd
            inputs:
              targetType: inline
              script: |
                set -e
                curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
                curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
                sudo apt-get update
                sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
                echo '##vso[task.prependpath]/opt/mssql-tools18/bin'

          - task: Bash@3
            displayName: Apply schema + data from scratch
            inputs:
              targetType: inline
              script: |
                set -e
                echo "Waiting for SQL Server..."
                for i in $(seq 1 40); do
                  if sqlcmd -S localhost,1433 -U sa -P "$(SA_PASSWORD)" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi
                  sleep 2
                  [ "$i" -eq 40 ] && { echo "SQL never ready"; exit 1; }
                done

                sqlcmd -S localhost,1433 -U sa -P "$(SA_PASSWORD)" -C -b \
                  -Q "IF DB_ID('$(DB_NAME)') IS NULL CREATE DATABASE [$(DB_NAME)];"

                echo "===== Applying schema ====="
                find schema -type f -name "*.sql" | sort | while IFS= read -r file; do
                  echo "Executing: $file"
                  sqlcmd -S localhost,1433 -U sa -P "$(SA_PASSWORD)" -d "$(DB_NAME)" -C -I -b -i "$file"
                done

                echo "===== Applying data ====="
                find data -type f -name "*.sql" | sort | while IFS= read -r file; do
                  echo "Executing: $file"
                  sqlcmd -S localhost,1433 -U sa -P "$(SA_PASSWORD)" -d "$(DB_NAME)" -C -I -b -i "$file"
                done
                echo "===== VALIDATION PASSED ====="

          - task: Bash@3
            displayName: Tear down container
            condition: always()
            inputs:
              targetType: inline
              script: docker rm -f radsql || true

  # ────────────────────────────────────────────────────────────────────────
  # Stage 2 — Dev DB  (MANUAL: only when queued with deployToDev: true)
  # Use this for an occasional real-Azure parity check before a prod release.
  # Because it no longer runs on every push, the serverless Dev DB stays idle
  # and auto-pauses between runs.
  # ────────────────────────────────────────────────────────────────────────
  - stage: DevDB
    displayName: Dev DB (manual)
    dependsOn: ValidateDB
    condition: and(succeeded(), eq('${{ parameters.deployToDev }}', true))
    variables:
      - group: sql-dev-secrets
    jobs:
      - job: RunSQL
        timeoutInMinutes: 60
        steps:
          - checkout: self

          - task: Bash@3
            displayName: Install sqlcmd
            inputs:
              targetType: inline
              script: |
                set -e
                curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
                curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
                sudo apt-get update
                sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
                echo '##vso[task.prependpath]/opt/mssql-tools18/bin'

          - task: Bash@3
            displayName: Deploy DB (Dev)
            condition: eq('${{ parameters.action }}', 'deploy')
            inputs:
              targetType: inline
              script: |
                set -e
                echo "===== DEV DEPLOY START ====="

                echo "Running schema scripts..."
                find schema -type f -name "*.sql" | sort | while IFS= read -r file
                do
                  echo "Executing: $file"
                  sqlcmd -S "$(SqlServer)" \
                         -d "$(DatabaseName)" \
                         -U "$(SqlUser)" \
                         -P "$(SqlPassword)" \
                         -C -I -b -i "$file"
                done

                echo "Running data scripts..."
                find data -type f -name "*.sql" | sort | while IFS= read -r file
                do
                  echo "Executing: $file"
                  sqlcmd -S "$(SqlServer)" \
                         -d "$(DatabaseName)" \
                         -U "$(SqlUser)" \
                         -P "$(SqlPassword)" \
                         -C -I -b -i "$file"
                done

                echo "===== DEV DEPLOY DONE ====="

          - task: Bash@3
            displayName: Rollback DB (Dev)
            condition: eq('${{ parameters.action }}', 'rollback')
            inputs:
              targetType: inline
              script: |
                set -e
                echo "===== DEV ROLLBACK START ====="
                find rollback -type f -name "*.sql" | sort -r | while IFS= read -r file
                do
                  echo "Executing: $file"
                  sqlcmd -S "$(SqlServer)" \
                         -d "$(DatabaseName)" \
                         -U "$(SqlUser)" \
                         -P "$(SqlPassword)" \
                         -C -I -b -i "$file"
                done
                echo "===== DEV ROLLBACK DONE ====="

  # ────────────────────────────────────────────────────────────────────────
  # Stage 3 — Prod
  # Runs ONLY when:
  #   (1) ValidateDB succeeded (container validation always gates prod)
  #   (2) The operator queued the run with deployToProd: true
  #   (3) An approver clicks Approve on the 'Production-DB' environment.
  #
  # Note: Prod now depends on ValidateDB (not DevDB), so a release does NOT
  # require deploying to Azure Dev first. Approval is configured in Azure DevOps
  # → Pipelines → Environments → Production-DB → Approvals and checks.
  # ────────────────────────────────────────────────────────────────────────
  - stage: ProdDB
    displayName: Prod DB
    dependsOn: ValidateDB
    condition: and(succeeded(), eq('${{ parameters.deployToProd }}', true))
    variables:
      - group: sql-prod-secrets
    jobs:
      - deployment: DeployProd
        environment: 'Production-DB'
        timeoutInMinutes: 180
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Bash@3
                  displayName: Install sqlcmd
                  inputs:
                    targetType: inline
                    script: |
                      set -e
                      curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
                      curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
                      sudo apt-get update
                      sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
                      echo '##vso[task.prependpath]/opt/mssql-tools18/bin'

                - task: Bash@3
                  displayName: Deploy DB (Prod)
                  condition: eq('${{ parameters.action }}', 'deploy')
                  inputs:
                    targetType: inline
                    script: |
                      set -e
                      echo "===== PROD DEPLOY START ====="
                      echo "Target server: $(SqlServer)"
                      echo "Target database: $(DatabaseName)"
                      echo "Commit: $(Build.SourceVersion)"
                      echo "Queued by: $(Build.RequestedFor)"

                      echo "Running schema scripts..."
                      find schema -type f -name "*.sql" | sort | while IFS= read -r file
                      do
                        echo "Executing: $file"
                        sqlcmd -S "$(SqlServer)" \
                               -d "$(DatabaseName)" \
                               -U "$(SqlUser)" \
                               -P "$(SqlPassword)" \
                               -C -I -b -i "$file"
                      done

                      echo "Running data scripts..."
                      find data -type f -name "*.sql" | sort | while IFS= read -r file
                      do
                        echo "Executing: $file"
                        sqlcmd -S "$(SqlServer)" \
                               -d "$(DatabaseName)" \
                               -U "$(SqlUser)" \
                               -P "$(SqlPassword)" \
                               -C -I -b -i "$file"
                      done

                      echo "===== PROD DEPLOY DONE ====="

                - task: Bash@3
                  displayName: Rollback DB (Prod)
                  condition: eq('${{ parameters.action }}', 'rollback')
                  inputs:
                    targetType: inline
                    script: |
                      set -e
                      echo "===== PROD ROLLBACK START ====="
                      echo "Target server: $(SqlServer)"
                      echo "Target database: $(DatabaseName)"
                      echo "Commit: $(Build.SourceVersion)"
                      echo "Queued by: $(Build.RequestedFor)"

                      find rollback -type f -name "*.sql" | sort -r | while IFS= read -r file
                      do
                        echo "Executing: $file"
                        sqlcmd -S "$(SqlServer)" \
                               -d "$(DatabaseName)" \
                               -U "$(SqlUser)" \
                               -P "$(SqlPassword)" \
                               -C -I -b -i "$file"
                      done

                      echo "===== PROD ROLLBACK DONE ====="
